# Scenario 1: CrashLoopBackOff caused by a missing environment variable.
# The app exits at startup because DATABASE_URL is not set.
apiVersion: v1
kind: Namespace
metadata: {name: scenario-crashloop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service, namespace: scenario-crashloop}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata: {labels: {app: payment-service}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Starting payment-service v2.3.1"
          echo "Loading configuration..."
          if [ -z "$DATABASE_URL" ]; then
            echo "FATAL: required environment variable DATABASE_URL is not set"
            exit 1
          fi
          sleep 3600
        env:
        - {name: PORT, value: "8080"}
---
apiVersion: v1
kind: Service
metadata: {name: payment-service, namespace: scenario-crashloop}
spec:
  selector: {app: payment-service}
  ports: [{port: 80, targetPort: 8080}]
