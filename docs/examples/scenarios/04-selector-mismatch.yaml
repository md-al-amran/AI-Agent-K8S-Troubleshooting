# Scenario 4: Service selector does not match the pod labels.
# The pods run fine (label app=orders), but the service selects app=orders-api, so it has no endpoints.
apiVersion: v1
kind: Namespace
metadata: {name: scenario-selector}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: scenario-selector}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
      - name: orders
        image: nginx:1.27
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: orders-api, namespace: scenario-selector}
spec:
  selector: {app: orders-api}
  ports: [{port: 80, targetPort: 80}]
