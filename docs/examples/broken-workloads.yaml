# Demo workloads with deliberate faults, for trying the agent.
#
#   kubectl apply -f docs/examples/broken-workloads.yaml
#   (wait 2-3 minutes for crashes and back-offs to build up)
#   curl -X POST http://localhost:8000/investigate
#   kubectl delete namespace ai-agent-test
#
# What is broken:
#   payment-service  crashes: DATABASE_URL is not set, cannot reach the database
#   bad-image        image tag does not exist (ImagePullBackOff)
#   too-big          requests 100 CPUs, cannot be scheduled (Pending)
#   checkout-svc     selector app=checkout, but the pod is labeled app=checkout-v2
#   api-svc          pod never becomes ready, and the service targets port 9090 instead of 8080
apiVersion: v1
kind: Namespace
metadata: {name: ai-agent-test}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service, namespace: ai-agent-test}
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector: {matchLabels: {app: payment}}
  template:
    metadata: {labels: {app: payment}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","echo Starting payment-service; echo 'Connecting to db:5432'; echo 'ERROR: connection refused to postgres at db:5432'; echo 'Fatal: DATABASE_URL environment variable is not set'; exit 1"]
---
apiVersion: v1
kind: Service
metadata: {name: payment-svc, namespace: ai-agent-test}
spec: {selector: {app: payment}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bad-image, namespace: ai-agent-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: bad-image}}
  template:
    metadata: {labels: {app: bad-image}}
    spec:
      containers: [{name: web, image: "nginx:tag-that-does-not-exist-123"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: too-big, namespace: ai-agent-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: too-big}}
  template:
    metadata: {labels: {app: too-big}}
    spec:
      containers: [{name: app, image: busybox:1.36, command: ["sleep","3600"], resources: {requests: {cpu: "100"}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: checkout-v2, namespace: ai-agent-test, labels: {app: checkout-v2}}
spec:
  containers: [{name: app, image: busybox:1.36, command: ["sleep","3600"], ports: [{containerPort: 8080}]}]
---
apiVersion: v1
kind: Service
metadata: {name: checkout-svc, namespace: ai-agent-test}
spec: {selector: {app: checkout}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Pod
metadata: {name: api-not-ready, namespace: ai-agent-test, labels: {app: api}}
spec:
  containers:
  - name: api
    image: busybox:1.36
    command: ["sleep","3600"]
    ports: [{containerPort: 8080}]
    readinessProbe: {exec: {command: ["false"]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: api-svc, namespace: ai-agent-test}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: 9090}]}
