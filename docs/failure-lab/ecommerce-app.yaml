# Demo e-commerce app: frontend (nginx) -> backend-api -> product-service -> database (postgres)
# Deploy:  kubectl --context kind-ecommerce-cluster-0X apply -f ecommerce-app.yaml
# Test:    kubectl -n ecommerce run curl --rm -it --image=curlimages/curl:8.11.1 --restart=Never -- curl -s frontend/api/products
#
# The app code lives in ConfigMaps (no image builds). Test-only credentials.
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels: {purpose: ai-agent-failure-test}
---
# ---------------- Database ----------------
apiVersion: v1
kind: Secret
metadata: {name: database-credentials, namespace: ecommerce}
stringData:
  POSTGRES_PASSWORD: shop-demo-password
---
apiVersion: v1
kind: ConfigMap
metadata: {name: database-config, namespace: ecommerce}
data:
  POSTGRES_DB: shop
  POSTGRES_USER: shop
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: database, namespace: ecommerce, labels: {app: database, tier: data}}
spec:
  replicas: 1
  selector: {matchLabels: {app: database}}
  template:
    metadata: {labels: {app: database, tier: data}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{name: postgres, containerPort: 5432}]
        envFrom: [{configMapRef: {name: database-config}}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: database-credentials, key: POSTGRES_PASSWORD}}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U shop -d shop"]}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: database, namespace: ecommerce}
spec:
  selector: {app: database}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
# ---------------- Product service ----------------
apiVersion: v1
kind: ConfigMap
metadata: {name: product-catalog, namespace: ecommerce}
data:
  catalog.json: |
    [
      {"id": 1, "name": "Kubernetes Mug", "price": 12.5},
      {"id": 2, "name": "Container Hoodie", "price": 49.0},
      {"id": 3, "name": "Helm Sticker Pack", "price": 4.99}
    ]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: product-service-code, namespace: ecommerce}
data:
  server.py: |
    import json, os, socket, sys
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DB_HOST = os.environ.get("DB_HOST", "database")
    DB_PORT = int(os.environ.get("DB_PORT", "5432"))
    CATALOG_PATH = os.environ.get("CATALOG_PATH", "/catalog/catalog.json")

    def log(msg):
        print(msg, flush=True)

    def database_ok():
        try:
            socket.create_connection((DB_HOST, DB_PORT), timeout=2).close()
            return True
        except OSError as exc:
            log(f"ERROR: database {DB_HOST}:{DB_PORT} is unreachable: {exc}")
            return False

    with open(CATALOG_PATH) as f:
        CATALOG = json.load(f)

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass
        def send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(data)
        def do_GET(self):
            if self.path == "/healthz":
                ok = database_ok()
                self.send(200 if ok else 503, {"database": "ok" if ok else "unreachable"})
            elif self.path == "/products":
                self.send(200, CATALOG)
            else:
                self.send(404, {"error": "not found"})

    log(f"product-service starting on :8080 (database {DB_HOST}:{DB_PORT}, {len(CATALOG)} products)")
    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: product-service, namespace: ecommerce, labels: {app: product-service, tier: backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: product-service}}
  template:
    metadata: {labels: {app: product-service, tier: backend}}
    spec:
      containers:
      - name: product-service
        image: python:3.12-alpine
        command: ["python", "-u", "/app/server.py"]
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: DB_HOST, value: database}
        - {name: DB_PORT, value: "5432"}
        - {name: CATALOG_PATH, value: /catalog/catalog.json}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 5
          timeoutSeconds: 4
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - {name: code, mountPath: /app}
        - {name: catalog, mountPath: /catalog}
      volumes:
      - {name: code, configMap: {name: product-service-code}}
      - {name: catalog, configMap: {name: product-catalog}}
---
apiVersion: v1
kind: Service
metadata: {name: product-service, namespace: ecommerce}
spec:
  selector: {app: product-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
# ---------------- Backend API ----------------
apiVersion: v1
kind: ConfigMap
metadata: {name: backend-config, namespace: ecommerce}
data:
  APP_MODE: production
  PRODUCT_SERVICE_URL: http://product-service:8080
---
apiVersion: v1
kind: ConfigMap
metadata: {name: backend-api-code, namespace: ecommerce}
data:
  server.py: |
    import json, os, sys, urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    def log(msg):
        print(msg, flush=True)

    APP_MODE = os.environ.get("APP_MODE", "")
    if APP_MODE not in ("development", "production"):
        log(f"FATAL: invalid configuration APP_MODE={APP_MODE!r} (from ConfigMap backend-config); expected 'development' or 'production'")
        sys.exit(1)
    PRODUCT_SERVICE_URL = os.environ.get("PRODUCT_SERVICE_URL")
    if not PRODUCT_SERVICE_URL:
        log("FATAL: required environment variable PRODUCT_SERVICE_URL is not set")
        sys.exit(1)

    def call_products(path):
        url = PRODUCT_SERVICE_URL.rstrip("/") + path
        try:
            with urllib.request.urlopen(url, timeout=3) as resp:
                return resp.status, json.loads(resp.read())
        except urllib.error.HTTPError as exc:
            log(f"ERROR: product-service returned HTTP {exc.code} for {url}")
            return 502, {"error": f"product-service HTTP {exc.code}"}
        except Exception as exc:
            reason = getattr(exc, "reason", exc)
            log(f"ERROR: cannot reach product-service at {url}: {reason}")
            return 502, {"error": f"product-service unreachable: {reason}"}

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass
        def send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(data)
        def do_GET(self):
            if self.path in ("/healthz", "/api/healthz"):
                code, _ = call_products("/healthz")
                self.send(200 if code == 200 else 503, {"backend": "ok", "product_service": code == 200})
            elif self.path in ("/products", "/api/products"):
                self.send(*call_products("/products"))
            else:
                self.send(404, {"error": "not found"})

    log(f"backend-api starting on :8080 (mode={APP_MODE}, products={PRODUCT_SERVICE_URL})")
    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend-api, namespace: ecommerce, labels: {app: backend-api, tier: backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-api}}
  template:
    metadata: {labels: {app: backend-api, tier: backend}}
    spec:
      containers:
      - name: backend-api
        image: python:3.12-alpine
        command: ["python", "-u", "/app/server.py"]
        ports: [{name: http, containerPort: 8080}]
        envFrom: [{configMapRef: {name: backend-config}}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 5
          timeoutSeconds: 4
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts: [{name: code, mountPath: /app}]
      volumes:
      - {name: code, configMap: {name: backend-api-code}}
---
apiVersion: v1
kind: Service
metadata: {name: backend-api, namespace: ecommerce}
spec:
  selector: {app: backend-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
# ---------------- Frontend ----------------
apiVersion: v1
kind: ConfigMap
metadata: {name: frontend-config, namespace: ecommerce}
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /api/ {
        proxy_pass http://backend-api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
      }
    }
  index.html: |
    <!doctype html><html><head><title>K8s Shop</title></head>
    <body><h1>K8s Shop</h1><ul id="p"></ul>
    <script>fetch('/api/products').then(r=>r.json()).then(ps=>{document.getElementById('p').innerHTML=ps.map(p=>`<li>${p.name} - $${p.price}</li>`).join('')})</script>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: ecommerce, labels: {app: frontend, tier: web}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: web}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /api/healthz, port: 80}
          periodSeconds: 5
          timeoutSeconds: 6
        resources:
          requests: {cpu: 20m, memory: 16Mi}
          limits: {memory: 64Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
        - {name: config, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
      volumes:
      - {name: config, configMap: {name: frontend-config}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: ecommerce}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: 80}]
